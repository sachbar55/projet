<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – MarketPro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-login-page">
  <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container" style="position:fixed;top:1rem;right:1rem;z-index:9999;width:360px;">
      {% for category, message in messages %}
      <div class="flash flash-{{ category }}">
        {{ message }}
        <button class="flash-close" onclick="this.parentElement.remove()">&times;</button>
      </div>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">
          <i class="fas fa-store"></i>
        </div>
        <h1>MarketPro</h1>
        <p>Interface Administrateur</p>
      </div>

      <form action="{{ url_for('admin_login') }}" method="post" class="login-form">
        <div class="form-group">
          <label for="username">
            <i class="fas fa-user"></i> Nom d'utilisateur
          </label>
          <input type="text" id="username" name="username" required autocomplete="username"
                 placeholder="Entrez votre nom d'utilisateur">
        </div>
        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i> Mot de passe
          </label>
          <div class="input-password-wrap">
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   placeholder="Entrez votre mot de passe">
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
      </form>

      <div class="login-hint">
        <small><i class="fas fa-info-circle"></i> Identifiants par défaut: <strong>admin / admin123</strong></small>
      </div>

      <a href="{{ url_for('index') }}" class="back-to-site">
        <i class="fas fa-arrow-left"></i> Retour au site
      </a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
    // Auto-dismiss flash after 4s
    setTimeout(() => {
      document.querySelectorAll('.flash').forEach(el => el.remove());
    }, 4000);
  </script>
</body>
</html>
